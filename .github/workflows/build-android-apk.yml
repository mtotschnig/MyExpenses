name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build universal external APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android platform 37.2 Preview
        shell: bash
        run: |
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$sdkmanager_path" ]; then
            echo "No Android sdkmanager found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" --install --channel=3 "platforms;android-37.2" "platform-tools"

      - name: Build APK
        run: ./gradlew --no-daemon myExpenses:packageExternReleaseUniversalApk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyExpenses-extern-release-universal-apk
          path: myExpenses/build/outputs/apk/extern/release/*.apk
          if-no-files-found: error
          retention-days: 14
