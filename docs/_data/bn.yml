bn:
  imprint: ইমপ্রিন্টিং
  imprint_text: এই ওয়েবসাইটের বিষয়বস্তুর উন্নয়ন, রক্ষণাবেক্ষণ এবং বিতরণের 
    জন্য দায়ী <i>{app_name}</i>
  hero_main: অ্যান্ড্রয়েড এর জন্য ব্যক্তিগত অর্থ ব্যবস্থাপক
  hero_sub:
    source: ওপেন সোর্স
    functionality: বর্ধিত সুবিধা
    use: ব্যবহার করা সহজ
  sections:
    features: বৈশিষ্ট্যসমূহ
    premium: প্রিমিয়াম নিন
    participate: অংশগ্রহণ
    faq: সাধারণ জিজ্ঞাসা
    versionlist: পরিবর্তন লগ
    credits: স্বীকৃতি
    licence: লাইসেন্স
    sourcecode: কোডের উৎস
    links: লিঙ্ক
  privacy_policy_heading: গোপনীয়তার নীতি
  menu_title:
    more_information: আরও তথ্য
  screenshot_titles:
    group: বছর, মাস বা সপ্তাহ অনুযায়ী গ্রুপ করুন
    summarize: আপনার সমস্ত অ্যাকাউন্টের ওভারভিউ
    budget: বার্ষিক, মাসিক এবং সাপ্তাহিক বাজেট
    split: একাধিক ক্যাটাগরিতে ভাগ করুন
    distribution: ক্যাটাগরি অনুযায়ী খরচের বিবরণ
    history: সময়ানুযায়ী আর্থিক প্রবণতা
    export: PDF, QIF এবং CSV-তে এক্সপোর্ট করুন
    sync: নিরাপদ ক্লাউড সিঙ্ক
  store:
    short_description: "ব্যবহার করা সহজ ব্যক্তিগত অর্থ ব্যবস্থাপক: সমৃদ্ধ সুবিধা এবং
      ওপেন সোর্স"
    full_description_intro: '{app_name} সরাসরি আপনার স্মার্টফোন এবং ট্যাবলেটে আপনার
      ব্যয় এবং আয়ের হিসাব রাখে।'
    full_description_contrib: 'নিম্নলিখিত লাইসেন্স কীগুলির মধ্যে একটি কেনার মাধ্যমে
      প্রিমিয়াম বৈশিষ্ট্যগুলি আনলক করা হয়:'
    full_description_contrib_amazon: 'লাইসেন্স কীগুলির মধ্যে একটি কেনার মাধ্যমে অনেক
      অতিরিক্ত বৈশিষ্ট্য আনলক করা হয়, যেমন:'
    highlight_1: একাধিক অ্যাকাউন্ট, টেমপ্লেট এবং বিভাগ সহ আপনার ব্যয় এবং আয়ের 
      হিসাব রাখুন
    highlight_2: WebDAV এবং Google Drive-এর মাধ্যমে একাধিক ফোন এবং ট্যাবলেটের 
      মধ্যে আপনার ডেটা শেয়ার করুন
    highlight_3: দিন, সপ্তাহ, মাস বা বছর অনুযায়ী আপনার আর্থিক পরিস্থিতির 
      সারসংক্ষেপ দেখুন
  privacy_policy_text: <i>{app_name}</i> আপনার ডিভাইসের নিজস্ব ডাটাবেস এবং এসডি 
    কার্ডে নিজস্ব ফোল্ডার ছাড়া অন্য কোনো ডেটা অ্যাক্সেস করে না। আপনি যদি ভবিষ্যৎ
    এবং পুনরাবৃত্ত লেনদেনের পরিকল্পনার বৈশিষ্ট্যটি ব্যবহার করেন, তবে আপনি 
    ক্যালেন্ডার বরাদ্দ করেন, যেখানে এই পরিকল্পনাগুলি সংরক্ষণ করা হয়।
  screenshots:
    group: দিন, সপ্তাহ, মাস এবং বছর অনুযায়ী আপনার লেনদেন দলভুক্ত করুন
    summarize: আপনার সমস্ত হিসাব যোগ করুন (প্রতিটি হিসাব এবং প্রতিটি লেনদেনের 
      জন্য বিনিময় হারের উন্নত ব্যবস্থাপনা)
    budget: বার্ষিক, মাসিক বা সাপ্তাহিক বাজেটে আপনি কত খরচ করতে চান তা নির্ধারণ 
      করুন
    split: একটি লেনদেনকে একাধিক বিভাগে বিভক্ত করুন
    distribution: বিভাগ অনুযায়ী বন্টন দৃশ্যমান করুন
    history: সময়ের সাথে সাথে আপনার আর্থিক পরিস্থিতি কীভাবে পরিবর্তিত হয় তা 
      বুঝুন
    export: PDF-এ প্রিন্ট করুন এবং QIF ও CSV-এর মাধ্যমে আদান-প্রদান করুন।
    sync: ব্যক্তিগত বা পাবলিক ক্লাউড পরিষেবার মাধ্যমে একাধিক ডিভাইসে এনক্রিপ্ট 
      করা হিসাবের ডেটা সিঙ্ক করুন।
  features:
    manage_accounts: <b>স্থানান্তর</b> সহ সর্বাধিক পাঁচটি হিসাব (এমনকি বিভিন্ন 
      মুদ্রার মধ্যেও)
    plans: সীমাহীন সংখ্যক <b>টেমপ্লেট</b> এবং <b>পুনরাবৃত্ত</b> লেনদেনের জন্য 
      সর্বাধিক তিনটি পরিকল্পনা
    export: <b>রপ্তানি</b> করুন QIF এবং CSV-তে। QIF থেকে <b>আমদানি</b> 
      করুন<b>রপ্তানি</b> করুন QIF এবং CSV-তে। QIF থেকে <b>আমদানি</b> করুন
    password: ডেটা <b>পাসওয়ার্ড</b> বা ডিভাইসের <b>লক স্ক্রিন</b> দ্বারা 
      সুরক্ষিত করা যেতে পারে
    light_theme: <b>থিম</b> (ডার্ক এবং লাইট) এবং <b>ফন্টের আকার</b> কাস্টমাইজ 
      করা যেতে পারে
    reconciliation: '<b>সমন্বয়</b>: আপনার ব্যাংক স্টেটমেন্টের সাথে লেনদেনের স্থিতি
      সহজেই তুলনা করুন'
    homescreen: দ্রুত ডেটা এন্ট্রির জন্য হোমস্ক্রিন <b>উইজেট</b> এবং 
      <b>শর্টকাট</b>
  contrib:
    thank_you: |
      আপনার অবদান My Expenses-এর আরও বিকাশকে সমর্থন করে। ধন্যবাদ!
    feature-list-title: 'অনুগ্রহ করে <i>{app_name}</i> আপগ্রেড করে অবদান রাখুন এবং
      নিম্নলিখিত বৈশিষ্ট্যগুলিতে অবাধ অ্যাক্সেস পান:'
    feature:
      accounts_unlimited: পাঁচটির বেশি হিসাব তৈরি করার সুবিধা আনলক করুন
      plans_unlimited: পুনরাবৃত্ত লেনদেনের জন্য তিনটির বেশি পরিকল্পনা তৈরি করার 
        সুবিধা আনলক করুন
      distribution: '<b>পাই চার্ট</b>: বিভিন্ন সময়কালে (বছর, মাস, সপ্তাহ, দিন) বিভাগ
        অনুযায়ী লেনদেনের পরিসংখ্যানগত বণ্টন দৃশ্যমান করুন'
      split_transaction: '<b>বিভক্ত লেনদেন</b>: একটি একক লেনদেনকে একাধিক অংশে বিভক্ত
        করা যেতে পারে (বিভাগ এবং স্থানান্তর)'
      print: লেনদেনের তালিকা একটি PDF ফাইলে <b>প্রিন্ট</b> করুন
      ad_free: <b>কোনো বিজ্ঞাপন নেই</b>
      csv_import: উন্নত, কাস্টমাইজযোগ্য <b>CSV আমদানি</b> (স্প্রেডশিট 
        অ্যাপ্লিকেশন)
      auto_backup: ক্লাউড স্টোরেজে ঐচ্ছিক আপলোড সহ দৈনিক <b>স্বয়ংক্রিয় 
        ব্যাকআপ</b>
      cloud_sync: '<b>ক্লাউড সিঙ্ক্রোনাইজেশন</b>: একাধিক ডিভাইসের মধ্যে ডেটা সিঙ্ক
        করা যেতে পারে'
      split_template: সীমাহীন সংখ্যক <b>বিভক্ত লেনদেনের জন্য টেমপ্লেট এবং 
        পরিকল্পনা</b>
      email_support: <b>ইমেল সমর্থন</b> ২ কার্যদিবসের মধ্যে নিশ্চিত প্রতিক্রিয়া
        সহ
      roadmap_voting: ভোটের অধিকার <b>উন্নয়ন রোডম্যাপে</b>
      history_chart: <b>ইতিহাস চার্ট</b> (নগদ প্রবাহ)
      budgeting: '<b>বাজেট নির্ধারণ</b>: দৈনিক, সাপ্তাহিক, মাসিক বা বার্ষিক ভিত্তিতে
        প্রতিটি বিভাগের জন্য আপনার নির্ধারিত সীমার সাথে ব্যয়ের তুলনা করুন।'
      scan_receipt: '<b>রসিদ স্ক্যান করুন</b>: স্বয়ংক্রিয়ভাবে পরিমাণ, তারিখ এবং
        প্রাপক বের করুন'
      webui: <b>ওয়েব ইউজার ইন্টারফেস</b>
      category_tree: <b>বিভাগ ট্রির</b> সীমাহীন গভীরতা
      banking: জার্মানির ব্যাঙ্কগুলি থেকে লেনদেন ডাউনলোড করুন (<b>FinTS</b>)
    one-time-payment: এককালীন অর্থপ্রদান
    subscription: সাবস্ক্রিপশন
  permissions:
    heading: <i>{app_name}</i>-এর নিম্নলিখিত <u>অনুমতিগুলির</u> প্রয়োজন
    calendar:
      label: ক্যালেন্ডার
      explanation: ভবিষ্যতের এবং পুনরাবৃত্ত লেনদেনের পরিকল্পনাগুলি একটি বিশেষ 
        স্থানীয় ক্যালেন্ডারে বা আপনার নির্ধারিত অন্য কোনো ক্যালেন্ডারে সংরক্ষণ 
        করা হয়।
    internet:
      label: ইন্টারনেট
      explanation_usage_tracking: নাম প্রকাশ না করে ব্যবহারের তথ্য সংগ্রহ
      explanation_crash_reporting: ক্র্যাশ রিপোর্ট
      explanation_key_validation: লাইসেন্স কী যাচাইকরণ
      explanation_cloud_sync: ক্লাউড সিঙ্ক্রোনাইজেশন
    accounts:
      label: অ্যাকাউন্ট
      explanation: ক্লাউড পরিষেবার মাধ্যমে ডিভাইস জুড়ে সিঙ্ক্রোনাইজেশন।
  contrib-key: কনট্রিব কী
  extended-key: এক্সটেন্ডেড কী
  professional-key: প্রফেশনাল কী
  all_contrib_key_features: কনট্রিব কী-এর সমস্ত বৈশিষ্ট্য
  all_extended_key_features: এক্সটেন্ডেড কী-এর সমস্ত বৈশিষ্ট্য
  customer_support: গ্রাহক সহায়তা
